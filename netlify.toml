[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 1. Redireciona todas as chamadas /api/* para a Netlify Function sem alterar as rotas do frontend
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

# 2. Rota específica do Webhook do Mercado Pago (garante correspondência direta para o webhook em produção)
[[redirects]]
  from = "/api/webhooks/mercadopago"
  to = "/.netlify/functions/api/api/webhooks/mercadopago"
  status = 200
  force = true

# 3. SPA Fallback: redireciona todas as páginas do SaaS (/dashboard, /leads, /projetos, /admin, etc.) para o index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
